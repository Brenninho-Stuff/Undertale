name: Build HTML5

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-html5:
    name: 🌐 Compile · HTML5
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Cache haxelib ─────────────────────────────────────────────────────
      - name: 💾 Cache haxelib
        uses: actions/cache@v4
        id: haxelib-cache
        with:
          path: ~/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('**/haxelib.json') }}
          restore-keys: |
            haxelib-${{ runner.os }}-

      # ── 3. Install Haxe + Neko via apt (stable, no broken download URLs) ─────
      - name: ⚙️ Install Haxe and Neko
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update -qq
          sudo apt-get install -y haxe neko
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
          haxe --version
          neko -version

      # ── 4. Install haxelibs ──────────────────────────────────────────────────
      - name: 📦 Install haxelibs
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        run: |
          haxelib install lime          --quiet
          haxelib install openfl        --quiet
          haxelib install flixel        --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui     --quiet
          haxelib install hscript       --quiet
          haxelib install actuate       --quiet

      # ── 5. Setup Lime / Flixel toolchain ─────────────────────────────────────
      - name: 🔧 Setup Lime toolchain
        run: |
          haxelib run lime setup flixel -y

      # ── 6. Build HTML5 ───────────────────────────────────────────────────────
      - name: 🔨 Build HTML5 (release)
        run: haxelib run lime build html5 -release

      # ── 7. Upload build artifact ─────────────────────────────────────────────
      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: undertale-html5-${{ github.sha }}
          path: export/html5/bin/
          retention-days: 14

  # ── Optional: Deploy to GitHub Pages ───────────────────────────────────────
  deploy-pages:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-html5
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:

      - name: 📥 Download HTML5 build
        uses: actions/download-artifact@v4
        with:
          name: undertale-html5-${{ github.sha }}
          path: dist/

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: 🚀 Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4